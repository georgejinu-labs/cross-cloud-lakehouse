services:

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-xe
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=${ORACLE_SYS_PASSWORD:-ChangeMeInProd}
      - APP_USER=healthcare
      - APP_USER_PASSWORD=${ORACLE_APP_PASSWORD:-ChangeMeInProd}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ../init:/container-entrypoint-initdb.d
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s healthcare/'${ORACLE_APP_PASSWORD:-ChangeMeInProd}'@//localhost/XEPDB1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  iceberg-rest:
    image: tabulario/iceberg-rest:0.6.0
    container_name: iceberg-rest
    ports:
      - "8080:8080"
    environment:
      - CATALOG_WAREHOUSE=file:///tmp/iceberg-warehouse
      - CATALOG_URI=jdbc:postgresql://postgres:5432/iceberg_catalog
      - CATALOG_JDBC_USER=iceberg
      - CATALOG_JDBC_PASSWORD=iceberg123
      - REST_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lakehouse-net

  postgres:
    image: postgres:15
    container_name: iceberg-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=iceberg_catalog
      - POSTGRES_USER=iceberg
      - POSTGRES_PASSWORD=iceberg123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - lakehouse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  lakehouse-net:
    driver: bridge
    name: lakehouse-net

volumes:
  postgres-data:
  oracle-data:
